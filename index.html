<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Simplified English Translator</title>
<style>
  :root {
    --bg: #f6f5f1; --panel: #ffffff; --ink: #1d1d1b; --muted: #6b6a64;
    --line: #dcdad2; --accent: #1f6f5c; --before: #a5412f; --after: #1f6f5c;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #151614; --panel: #1f201d; --ink: #ecebe5; --muted: #9a998f;
      --line: #35362f; --accent: #5cc4a6; --before: #e58a76; --after: #5cc4a6;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font: 16px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  main { max-width: 1100px; margin: 0 auto; padding: 32px 16px 64px; }
  h1 { font-size: 1.6rem; margin: 0 0 4px; }
  .sub { color: var(--muted); margin: 0 0 24px; }
  .editors { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  .pane { display: flex; flex-direction: column; gap: 6px; }
  .pane-head { display: flex; justify-content: space-between; align-items: center; min-height: 30px; }
  label { font-weight: 600; font-size: .85rem; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); }
  textarea {
    width: 100%; min-height: 260px; resize: vertical; padding: 14px;
    background: var(--panel); color: var(--ink);
    border: 1px solid var(--line); border-radius: 10px;
    font: inherit; line-height: 1.55;
  }
  textarea:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
  button {
    font: inherit; font-size: .85rem; padding: 4px 12px; cursor: pointer;
    background: var(--panel); color: var(--ink);
    border: 1px solid var(--line); border-radius: 6px;
  }
  button:hover { border-color: var(--accent); color: var(--accent); }
  h2 { margin: 40px 0 12px; font-size: 1.2rem; }
  .rules { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 14px; counter-reset: rule; }
  .rule {
    background: var(--panel); border: 1px solid var(--line); border-radius: 10px;
    padding: 16px; counter-increment: rule;
  }
  .rule h3 { margin: 0 0 4px; font-size: 1rem; }
  .rule h3::before { content: counter(rule) ". "; color: var(--muted); }
  .rule p { margin: 0 0 12px; color: var(--muted); font-size: .9rem; }
  .ex { display: flex; align-items: center; gap: 10px; font-size: 1.05rem; padding: 2px 0; }
  .ex .b { color: var(--before); min-width: 6.5em; }
  .ex .a { color: var(--after); font-weight: 600; }
  .ex .arrow { color: var(--muted); }
  @media (max-width: 700px) { .editors { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<main>
  <h1>Simplified English Translator</h1>
  <p class="sub">Paste regular US/UK English on the left. Simplified English appears on the right.</p>

  <div class="editors">
    <div class="pane">
      <div class="pane-head"><label for="src">Regular English</label></div>
      <textarea id="src" spellcheck="false" placeholder="Type or paste text here…">Chris checked the cell and the chicken track in the city. Chat about the classic mess!</textarea>
    </div>
    <div class="pane">
      <div class="pane-head"><label for="out">Simplified English</label><button id="copy" type="button">Copy</button></div>
      <textarea id="out" readonly spellcheck="false"></textarea>
    </div>
  </div>

  <h2>Rules</h2>
  <div class="rules" id="rules"></div>
</main>

<script src="rules.js"></script>
<script>
  const src = document.getElementById("src");
  const out = document.getElementById("out");
  const update = () => { out.value = translate(src.value); };
  src.addEventListener("input", update);
  update();

  document.getElementById("copy").addEventListener("click", async (e) => {
    try { await navigator.clipboard.writeText(out.value); }
    catch { out.select(); document.execCommand("copy"); }
    e.target.textContent = "Copied";
    setTimeout(() => (e.target.textContent = "Copy"), 1200);
  });

  const rulesEl = document.getElementById("rules");
  const SHOWN = ["hard-c", "soft-c", "ch", "ss", "ck"].map((id) => RULES.find((r) => r.id === id));
  for (const r of SHOWN) {
    const card = document.createElement("section");
    card.className = "rule";
    const h = document.createElement("h3"); h.textContent = r.title;
    const p = document.createElement("p"); p.textContent = r.note;
    card.append(h, p);
    for (const ex of r.examples) {
      const row = document.createElement("div"); row.className = "ex";
      row.innerHTML = '<span class="b"></span><span class="arrow">→</span><span class="a"></span>';
      row.querySelector(".b").textContent = ex;
      row.querySelector(".a").textContent = translate(ex);
      card.append(row);
    }
    rulesEl.append(card);
  }
</script>
</body>
</html>
